[project]
name = "ragmcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Laksito Pamilih", email = "laksito@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "jinja2>=3.1.6",
    "mcp[cli]>=2.3.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "sentence-transformers>=3",
    "trafilatura>=2.3.1",
]

[project.scripts]
ragmcp = "ragmcp:main"
ragmcp-eval = "ragmcp.evalset:main"
ragmcp-web = "ragmcp.web:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
